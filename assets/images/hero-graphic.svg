<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" width="100%" height="100%">
  <defs>
    <!-- Midnight Navy Depth Gradients -->
    <radialGradient id="navyCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B2F4A" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#14243A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0E1B2D" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Antique Gold Metallic Gradients -->
    <linearGradient id="antiqueGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D3AF"/>
      <stop offset="40%" stop-color="#B69A65"/>
      <stop offset="80%" stop-color="#8F7442"/>
      <stop offset="100%" stop-color="#6E562D"/>
    </linearGradient>

    <linearGradient id="antiqueGoldHairline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B69A65" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#B69A65" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#B69A65" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="goldAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Background Navy Aura -->
  <circle cx="340" cy="340" r="320" fill="url(#navyCoreGlow)"/>

  <!-- Outer Architectural Reticle -->
  <circle cx="340" cy="340" r="310" fill="none" stroke="#B69A65" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="3 9"/>
  <circle cx="340" cy="340" r="275" fill="none" stroke="#B69A65" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="340" cy="340" r="268" fill="none" stroke="#B69A65" stroke-opacity="0.1" stroke-width="0.75"/>

  <!-- Cardinal Coordinate Lines & Ticks -->
  <g stroke="#B69A65" stroke-opacity="0.22" stroke-width="1">
    <line x1="340" y1="15" x2="340" y2="70"/>
    <line x1="340" y1="610" x2="340" y2="665"/>
    <line x1="15" y1="340" x2="70" y2="340"/>
    <line x1="610" y1="340" x2="665" y2="340"/>
    
    <!-- Diagonal Precision Reticles -->
    <line x1="120" y1="120" x2="150" y2="150"/>
    <line x1="560" y1="120" x2="530" y2="150"/>
    <line x1="120" y1="560" x2="150" y2="530"/>
    <line x1="560" y1="560" x2="530" y2="530"/>
  </g>

  <!-- Major Kinetic Orbit Rings (Rotated) -->
  <g transform="translate(340, 340)">
    <!-- Orbit 1 -->
    <ellipse cx="0" cy="0" rx="255" ry="95" fill="none" stroke="url(#antiqueGoldGrad)" stroke-width="1.5" stroke-opacity="0.6" transform="rotate(-30)"/>
    <circle cx="215" cy="-135" r="4.5" fill="#F5F2EA" filter="url(#goldAura)"/>
    
    <!-- Orbit 2 -->
    <ellipse cx="0" cy="0" rx="255" ry="95" fill="none" stroke="url(#antiqueGoldGrad)" stroke-width="1.5" stroke-opacity="0.6" transform="rotate(45)"/>
    <circle cx="-185" cy="170" r="4" fill="#B69A65"/>
    
    <!-- Inner Concentric Gyroscope Rings -->
    <circle cx="0" cy="0" r="175" fill="none" stroke="#B69A65" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="12 6"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#antiqueGoldGrad)" stroke-width="1.8" stroke-opacity="0.75"/>
    <circle cx="0" cy="0" r="85" fill="#14243A" stroke="#B69A65" stroke-width="1" stroke-opacity="0.45"/>
  </g>

  <!-- Central Isometric Monolith Prism (Architectural Core) -->
  <g transform="translate(340, 340)">
    <!-- Top Rhombus Face -->
    <polygon points="0,-65 56,-32 0,0 -56,-32" fill="#1E3553" stroke="#B69A65" stroke-width="1.5"/>
    
    <!-- Left Vertical Face -->
    <polygon points="-56,-32 0,0 0,65 -56,32" fill="#14243A" stroke="#B69A65" stroke-width="1.2"/>
    
    <!-- Right Vertical Face -->
    <polygon points="0,0 56,-32 56,32 0,65" fill="#0E1B2D" stroke="#B69A65" stroke-width="1.2"/>

    <!-- Core Golden Axis Line & Jewel -->
    <line x1="0" y1="-85" x2="0" y2="85" stroke="#F5F2EA" stroke-width="1" stroke-dasharray="2 3"/>
    <circle cx="0" cy="0" r="5" fill="#F5F2EA"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#B69A65" stroke-width="1" stroke-opacity="0.65"/>
  </g>

  <!-- Technical Telemetry & Studio Coordinates -->
  <g font-family="'Manrope', -apple-system, sans-serif" font-size="8.5" fill="#B69A65" letter-spacing="2.5" opacity="0.8">
    <text x="340" y="45" text-anchor="middle">COORD: 45°28'N / 09°11'E</text>
    <text x="635" y="344" text-anchor="end">SYS.ARCH // 2026</text>
    <text x="340" y="642" text-anchor="middle">ATELIER CORE // AUTONOMOUS</text>
    <text x="45" y="344" text-anchor="start">LATENCY: &lt; 0.8s</text>
  </g>

  <!-- Corner Precision Markers (+) -->
  <g stroke="#B69A65" stroke-opacity="0.45" stroke-width="1.2">
    <line x1="60" y1="52" x2="60" y2="68"/>
    <line x1="52" y1="60" x2="68" y2="60"/>
    <line x1="620" y1="52" x2="620" y2="68"/>
    <line x1="612" y1="60" x2="628" y2="60"/>
    <line x1="60" y1="612" x2="60" y2="628"/>
    <line x1="52" y1="620" x2="68" y2="620"/>
    <line x1="620" y1="612" x2="620" y2="628"/>
    <line x1="612" y1="620" x2="628" y2="620"/>
  </g>
</svg>