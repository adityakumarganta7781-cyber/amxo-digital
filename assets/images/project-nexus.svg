<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="100%" height="100%">
  <defs>
    <linearGradient id="chassisGradNexus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14243A"/>
      <stop offset="60%" stop-color="#0E1B2D"/>
      <stop offset="100%" stop-color="#09121E"/>
    </linearGradient>
    <linearGradient id="goldNexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E7CD"/>
      <stop offset="45%" stop-color="#B69A65"/>
      <stop offset="100%" stop-color="#7B5F2E"/>
    </linearGradient>
    <filter id="shadowNexus" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="900" height="580" fill="#0A1422"/>

  <g stroke="#B69A65" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="90" x2="900" y2="90"/>
    <line x1="0" y1="490" x2="900" y2="490"/>
    <line x1="90" y1="0" x2="900" y2="0"/>
    <line x1="810" y1="0" x2="810" y2="580"/>
  </g>

  <!-- Browser Chassis -->
  <g transform="translate(45, 35)" filter="url(#shadowNexus)">
    <rect width="810" height="510" rx="14" fill="url(#chassisGradNexus)" stroke="#B69A65" stroke-opacity="0.28" stroke-width="1.2"/>
    
    <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 796 0 C 803.732 0 810 6.268 810 14 L 810 44 L 0 44 Z" fill="#0C1726"/>
    <line x1="0" y1="44" x2="810" y2="44" stroke="#B69A65" stroke-opacity="0.18" stroke-width="1"/>
    
    <circle cx="28" cy="22" r="5" fill="#B69A65" fill-opacity="0.4"/>
    <circle cx="44" cy="22" r="5" fill="#B69A65" fill-opacity="0.4"/>
    <circle cx="60" cy="22" r="5" fill="#B69A65" fill-opacity="0.4"/>

    <rect x="235" y="11" width="340" height="22" rx="11" fill="#14243A" stroke="#B69A65" stroke-opacity="0.22" stroke-width="0.8"/>
    <text x="405" y="26" font-family="'Manrope', sans-serif" font-size="9" fill="#B69A65" opacity="0.85" text-anchor="middle" letter-spacing="1.5">nexus-intelligence.io // AUTONOMOUS-AI</text>

    <rect x="660" y="11" width="128" height="22" rx="4" fill="#B69A65" fill-opacity="0.12" stroke="#B69A65" stroke-opacity="0.35" stroke-width="0.8"/>
    <text x="724" y="25" font-family="'Manrope', sans-serif" font-size="7.5" fill="#B69A65" font-weight="700" text-anchor="middle" letter-spacing="1">CONCEPT ARCHIVE</text>

    <!-- Header Section -->
    <g transform="translate(40, 75)">
      <circle cx="6" cy="7" r="4" fill="#38ef7d"/>
      <text x="20" y="12" font-family="'Cormorant Garamond', serif" font-size="18" fill="#F5F2EA" letter-spacing="4">NEXUS AI GOVERNANCE SYSTEM</text>
      <text x="730" y="12" font-family="'Manrope', sans-serif" font-size="9.5" fill="#38ef7d" text-anchor="end" letter-spacing="2">ACTIVE CONSENSUS PROTOCOL</text>
      <line x1="0" y1="30" x2="730" y2="30" stroke="#B69A65" stroke-opacity="0.15" stroke-width="1"/>
    </g>

    <!-- Left Column: AI Value Proposition & Telemetry -->
    <g transform="translate(40, 140)">
      <text x="0" y="14" font-family="'Manrope', sans-serif" font-size="9" fill="#B69A65" letter-spacing="2.5" font-weight="600">[ 03 // AGENTIC SAFETY COMPLIANCE ]</text>
      
      <text x="0" y="60" font-family="'Cormorant Garamond', serif" font-size="46" fill="#F5F2EA" font-weight="400">Autonomous Agentic</text>
      <text x="0" y="105" font-family="'Cormorant Garamond', serif" font-size="46" fill="url(#goldNexusGrad)" font-style="italic" font-weight="400">Inference Guardian</text>

      <text x="0" y="145" font-family="'Manrope', sans-serif" font-size="13" fill="#D3CABE" font-weight="300">
        Sub-4ms inference auditing across 100k+ enterprise requests/sec with
      </text>
      <text x="0" y="168" font-family="'Manrope', sans-serif" font-size="13" fill="#D3CABE" font-weight="300">
        cryptographic consensus verification and autonomous guardrail enforcement.
      </text>

      <!-- Metrics Row (3 Units) -->
      <g transform="translate(0, 205)">
        <rect x="0" y="0" width="138" height="78" rx="6" fill="#0C1726" stroke="#B69A65" stroke-opacity="0.3" stroke-width="1"/>
        <text x="16" y="26" font-family="'Manrope', sans-serif" font-size="9" fill="#B69A65" opacity="0.85">INFERENCE LATENCY</text>
        <text x="16" y="60" font-family="'Cormorant Garamond', serif" font-size="30" fill="#F5F2EA" font-weight="600">&lt; 3.8 ms</text>

        <rect x="154" y="0" width="138" height="78" rx="6" fill="#0C1726" stroke="#B69A65" stroke-opacity="0.3" stroke-width="1"/>
        <text x="170" y="26" font-family="'Manrope', sans-serif" font-size="9" fill="#B69A65" opacity="0.85">RISK MITIGATION</text>
        <text x="170" y="60" font-family="'Cormorant Garamond', serif" font-size="30" fill="url(#goldNexusGrad)" font-weight="600">99.98%</text>

        <rect x="308" y="0" width="138" height="78" rx="6" fill="#0C1726" stroke="#B69A65" stroke-opacity="0.3" stroke-width="1"/>
        <text x="324" y="26" font-family="'Manrope', sans-serif" font-size="9" fill="#B69A65" opacity="0.85">MODELS BOUND</text>
        <text x="324" y="60" font-family="'Cormorant Garamond', serif" font-size="30" fill="#F5F2EA" font-weight="600">14 LLMs</text>
      </g>
    </g>

    <!-- Right Column: Interactive Neural Node Visualizer -->
    <g transform="translate(515, 145)">
      <rect x="0" y="0" width="255" height="275" rx="8" fill="#0B1522" stroke="#B69A65" stroke-opacity="0.35" stroke-width="1"/>
      <text x="20" y="26" font-family="'Manrope', sans-serif" font-size="9" fill="#B69A65" letter-spacing="1">DISTRIBUTED CONSENSUS NODES</text>

      <g transform="translate(30, 45)" stroke="#B69A65" stroke-opacity="0.5" stroke-width="1.2">
        <line x1="30" y1="50" x2="105" y2="35"/>
        <line x1="30" y1="50" x2="60" y2="120"/>
        <line x1="105" y1="35" x2="170" y2="70"/>
        <line x1="60" y1="120" x2="140" y2="140"/>
        <line x1="170" y1="70" x2="140" y2="140"/>
        <line x1="140" y1="140" x2="100" y2="185"/>
        <line x1="60" y1="120" x2="100" y2="185"/>
        <line x1="105" y1="35" x2="140" y2="140" stroke-dasharray="3 3"/>

        <!-- Nodes -->
        <circle cx="30" cy="50" r="7" fill="url(#goldNexusGrad)"/>
        <circle cx="105" cy="35" r="9" fill="#F5F2EA" stroke="#B69A65" stroke-width="2"/>
        <circle cx="170" cy="70" r="6" fill="url(#goldNexusGrad)"/>
        <circle cx="60" cy="120" r="8" fill="url(#goldNexusGrad)"/>
        <circle cx="140" cy="140" r="11" fill="#14243A" stroke="#B69A65" stroke-width="2"/>
        <circle cx="140" cy="140" r="5" fill="#F5E7CD"/>
        <circle cx="100" cy="185" r="7" fill="url(#goldNexusGrad)"/>
      </g>
    </g>

    <!-- Bottom Actions Strip -->
    <g transform="translate(40, 455)">
      <line x1="0" y1="0" x2="730" y2="0" stroke="#B69A65" stroke-opacity="0.15" stroke-width="1"/>
      <text x="0" y="24" font-family="'Manrope', sans-serif" font-size="11.5" fill="#D3CABE">
        Autonomous scenario stress testing and enterprise protocol sandbox.
      </text>
      <rect x="580" y="6" width="150" height="32" rx="4" fill="url(#goldNexusGrad)"/>
      <text x="655" y="26" font-family="'Manrope', sans-serif" font-size="10.5" fill="#0C1726" font-weight="700" text-anchor="middle" letter-spacing="1">DEPLOY PROTOCOL</text>
    </g>
  </g>
</svg>